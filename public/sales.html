<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TimeFit 매출 관리</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#191f28;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:40px 20px 64px}.login{max-width:420px;margin:92px auto}.card,.filter,.login{background:#fff;border:1px solid #e5edf8;border-radius:22px;box-shadow:0 12px 32px #2357960d}.login{padding:32px;display:grid;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#3182f6;color:#fff;font-style:normal}.login p,.sub,.message{color:#6b7684}.login p{font-size:14px;line-height:1.55;margin:0 0 10px}label{display:grid;gap:7px;font-size:13px;font-weight:700;color:#4e5968}input,select{border:1px solid #d7e2f0;border-radius:12px;padding:12px;font:inherit;color:#191f28;background:#fff}button{border:0;border-radius:12px;padding:12px 16px;background:#3182f6;color:#fff;font:700 14px inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#edf4ff;color:#3182f6}#dashboard{display:none}.top{display:flex;justify-content:space-between;align-items:start;gap:18px;margin-bottom:22px}h1{margin:8px 0;font-size:30px;letter-spacing:-1.4px}.eyebrow{color:#3182f6;font-size:13px;font-weight:800;margin:0}.sub{margin:0}.filter{padding:16px;display:flex;flex-wrap:wrap;align-items:end;gap:10px}.filter label{min-width:155px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{padding:20px}.metric{font-size:25px;font-weight:800;letter-spacing:-.8px;margin-top:10px}.table-card{overflow:hidden}.table-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px;border-bottom:1px solid #edf1f5;font-weight:800}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:13px 20px;border-bottom:1px solid #f0f3f6;white-space:nowrap}th{font-size:12px;color:#6b7684;background:#fbfcfd}td.amount,th.amount{text-align:right;font-variant-numeric:tabular-nums}.pagination{display:flex;justify-content:space-between;align-items:center;padding:15px 20px}.section{margin-top:18px}.menu-tools{padding:14px 20px;border-bottom:1px solid #edf1f5;display:flex;gap:10px;flex-wrap:wrap}.menu-tools input,.menu-tools select{padding:9px}.error{color:#d63c3c;font-size:13px}@media(max-width:720px){main{padding:22px 12px}.cards{grid-template-columns:1fr 1fr}.table-card{overflow:auto}.top{display:block}h1{font-size:26px}.filter label{min-width:calc(50% - 6px)}th,td{padding:12px}}@media(max-width:430px){.cards{grid-template-columns:1fr}.filter label{min-width:100%}}
  </style>
</head>
<body>
  <section class="login" id="login"><div class="brand"><i>✓</i>timefit</div><h2>매출 관리 로그인</h2><p>토스플레이스 주문 및 메뉴 매출은 권한이 있는 운영자만 조회할 수 있습니다.</p><label>아이디<input id="username" autocomplete="username" required /></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required /></label><button id="loginButton" type="button">매출 데이터 조회</button><span id="loginMessage" class="error"></span></section>
  <main id="dashboard"><header class="top"><div><p class="eyebrow">TOSS PLACE · SALES</p><h1>매출 관리</h1><p class="sub">동기화된 주문 데이터를 조회합니다. Toss POS 주문·결제는 변경하지 않습니다.</p></div><button class="secondary" id="logout">로그아웃</button></header>
    <form class="filter" id="filters"><label>시작일<input type="date" id="from" /></label><label>종료일<input type="date" id="to" /></label><button type="submit">조회</button><button class="secondary" type="button" id="reset">전체 기간</button></form>
    <section class="cards"><article class="card"><label>전체 주문</label><div class="metric" id="orderCount">-</div></article><article class="card"><label>완료 주문</label><div class="metric" id="completedCount">-</div></article><article class="card"><label>완료 매출</label><div class="metric" id="orderAmount">-</div></article><article class="card"><label>취소 상태 주문</label><div class="metric" id="cancelledCount">-</div></article></section>
    <section class="card table-card"><div class="table-head">주문 목록 <span class="message" id="message"></span></div><table><thead><tr><th>주문 시각</th><th>주문 ID</th><th>상태</th><th>주문 경로</th><th class="amount">주문 금액</th></tr></thead><tbody id="rows"></tbody></table><div class="pagination"><span class="message" id="pageInfo"></span><div><button class="secondary" id="previous">이전</button> <button class="secondary" id="next">다음</button></div></div></section>
    <section class="card table-card section"><div class="table-head">메뉴 판매 현황 <span class="message" id="menuMessage"></span></div><div class="menu-tools"><select id="categoryFilter"><option value="">전체 카테고리</option></select><input id="menuSearch" type="search" placeholder="메뉴명 검색" /><select id="menuSort"><option value="sales">매출액 높은순</option><option value="quantity">판매 수량 많은순</option><option value="name">메뉴명 가나다순</option></select></div><table><thead><tr><th>메뉴</th><th>카테고리</th><th class="amount">판매 수량</th><th class="amount">메뉴 매출</th><th class="amount">주문 건수</th></tr></thead><tbody id="menuRows"></tbody></table></section>
  </main>
  <script>
    const $=id=>document.getElementById(id), fmt=new Intl.NumberFormat('ko-KR'), currency=v=>`${fmt.format(Number(v||0))}원`, dateTime=v=>v?new Intl.DateTimeFormat('ko-KR',{dateStyle:'short',timeStyle:'short',timeZone:'Asia/Seoul'}).format(new Date(v)):'-', esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let authorization='',page=1,hasNext=false,menus=[];
    const parameters=()=>{const p=new URLSearchParams({page,size:50});if($('from').value)p.set('from',$('from').value);if($('to').value)p.set('to',$('to').value);return p};
    async function load(){ $('message').textContent='불러오는 중…'; const r=await fetch(`/api/sales-dashboard?${parameters()}`,{headers:{Authorization:authorization}});if(!r.ok){if(r.status===401){$('dashboard').style.display='none';$('login').style.display='grid';$('loginMessage').textContent='아이디 또는 비밀번호가 올바르지 않습니다.'}else $('message').textContent='매출 데이터를 불러오지 못했습니다.';return}const d=await r.json();$('orderCount').textContent=`${fmt.format(d.summary.orderCount)}건`;$('completedCount').textContent=`${fmt.format(d.summary.completedOrderCount)}건`;$('orderAmount').textContent=currency(d.summary.completedAmount);$('cancelledCount').textContent=`${fmt.format(d.summary.cancelledCount)}건`;$('rows').innerHTML=d.orders.map(o=>`<tr><td>${dateTime(o.ordered_at)}</td><td>${esc(o.order_id)}</td><td>${esc(o.state||'-')}</td><td>${esc(o.source||'-')}</td><td class="amount">${currency(o.total_amount)}</td></tr>`).join('')||'<tr><td colspan="5">조회된 주문이 없습니다.</td></tr>';hasNext=d.hasNextPage;$('previous').disabled=page===1;$('next').disabled=!hasNext;$('message').textContent='최신 주문 기준';$('pageInfo').textContent=`${page}페이지`;}
    async function loadMenus(){ $('menuMessage').textContent='불러오는 중…';const p=parameters();p.set('limit','500');const r=await fetch(`/api/menu-sales-dashboard?${p}`,{headers:{Authorization:authorization}});if(!r.ok){$('menuMessage').textContent='메뉴 현황을 불러오지 못했습니다.';return}const d=await r.json();menus=d.menus;const cats=[...new Set(menus.map(x=>x.category_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));$('categoryFilter').innerHTML='<option value="">전체 카테고리</option>'+cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');renderMenus()}
    function renderMenus(){const category=$('categoryFilter').value,keyword=$('menuSearch').value.trim().toLowerCase(),sort=$('menuSort').value;const data=menus.filter(x=>(!category||x.category_name===category)&&(!keyword||String(x.menu_name).toLowerCase().includes(keyword))).sort((a,b)=>sort==='name'?String(a.menu_name).localeCompare(String(b.menu_name),'ko'):sort==='quantity'?Number(b.sold_quantity)-Number(a.sold_quantity):Number(b.gross_sales_amount)-Number(a.gross_sales_amount));$('menuRows').innerHTML=data.map(x=>`<tr><td>${esc(x.menu_name)}</td><td>${esc(x.category_name||'-')}</td><td class="amount">${fmt.format(x.sold_quantity)}개</td><td class="amount">${currency(x.gross_sales_amount)}</td><td class="amount">${fmt.format(x.order_count)}건</td></tr>`).join('')||'<tr><td colspan="5">조건에 맞는 메뉴가 없습니다.</td></tr>';$('menuMessage').textContent=`${fmt.format(data.length)}개 메뉴 · 완료 주문 기준`}
    $('loginButton').onclick=()=>{authorization=`Basic ${btoa(`${$('username').value}:${$('password').value}`)}`;$('loginMessage').textContent='';$('login').style.display='none';$('dashboard').style.display='block';load();loadMenus()};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginButton').click()};$('filters').onsubmit=e=>{e.preventDefault();page=1;load();loadMenus()};$('reset').onclick=()=>{$('from').value='';$('to').value='';page=1;load();loadMenus()};$('previous').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(hasNext){page++;load()}};$('categoryFilter').onchange=renderMenus;$('menuSearch').oninput=renderMenus;$('menuSort').onchange=renderMenus;$('logout').onclick=()=>{authorization='';$('dashboard').style.display='none';$('login').style.display='grid';$('password').value=''};
  </script>
</body>
</html>
